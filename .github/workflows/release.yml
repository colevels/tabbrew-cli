name: Release

# Cut a release by pushing a version tag that matches package.json:
#   git tag v0.9.0 && git push origin v0.9.0
# The binaries are built here, in a clean runner, and each asset carries a
# SLSA build-provenance attestation linking it to this commit and run:
#   gh attestation verify tabbrew-<os>-<arch> --repo colevels/tabbrew-cli
# Afterwards tabbrew-cli and @tabbrew/sdk go to npm and the formula in
# colevels/homebrew-tap is regenerated from checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets
  id-token: write # OIDC token the attestation and npm provenance sign with
  attestations: write

jobs:
  release:
    # macOS, for codesign: see "Sign the macOS binaries" below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The SDK is versioned in lockstep: @tabbrew/sdk x.y.z speaks the
      # protocol of tabbrew-cli x.y.z.
      - name: Tag must match package.json and sdk/package.json
        run: |
          for manifest in package.json sdk/package.json; do
            version="v$(jq -r .version "$manifest")"
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME does not match $manifest $version" >&2
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5 # keep in sync with ci.yml

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:sdk

      # Bun cross-compiles every target from this one runner.
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build src/index.ts --compile --target=bun-$target --outfile dist/tabbrew-$target
          done

      # Bun leaves stale page hashes in the ad-hoc signature of a darwin binary
      # (1.3.5: both; 1.4.2: still x64), and macOS 27 kills such a binary at
      # launch with a bare SIGKILL. Signing again rehashes every page. This runs
      # before the checksums and the attestation, which cover the signed bytes.
      - name: Sign the macOS binaries
        run: |
          codesign --force --sign - dist/tabbrew-darwin-arm64 dist/tabbrew-darwin-x64
          codesign --verify --strict dist/tabbrew-darwin-arm64 dist/tabbrew-darwin-x64
          ./dist/tabbrew-darwin-arm64 --version

      - name: Build extension
        run: |
          bun run build:ext
          bun run zip:ext
          cp extension/dist/tabbrew-extension.zip dist/

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 tabbrew-darwin-arm64 tabbrew-darwin-x64 tabbrew-linux-arm64 tabbrew-linux-x64 tabbrew-extension.zip > checksums.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/tabbrew-darwin-arm64
            dist/tabbrew-darwin-x64
            dist/tabbrew-linux-arm64
            dist/tabbrew-linux-x64
            dist/tabbrew-extension.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/tabbrew-darwin-arm64 \
            dist/tabbrew-darwin-x64 \
            dist/tabbrew-linux-arm64 \
            dist/tabbrew-linux-x64 \
            dist/tabbrew-extension.zip \
            dist/checksums.txt

  # Needs the NPM_TOKEN repository secret (a granular access token with
  # publish rights on tabbrew-cli).
  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Its own job so that it can be re-run alone: a version npm already has
  # fails the job above for good. NPM_TOKEN must also cover the @tabbrew scope.
  npm-sdk:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run build:sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Needs the HOMEBREW_TAP_TOKEN repository secret (a fine-grained PAT with
  # Contents read/write on colevels/homebrew-tap only).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Render formula from the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist
          bun scripts/homebrew-formula.ts "${GITHUB_REF_NAME#v}" dist/checksums.txt > dist/tabbrew.rb
      - uses: actions/checkout@v7
        with:
          repository: colevels/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push formula to the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../dist/tabbrew.rb Formula/tabbrew.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tabbrew.rb
          # A re-run, or a formula bumped by hand, leaves nothing to commit.
          git diff --cached --quiet && exit 0
          git commit -m "tabbrew ${GITHUB_REF_NAME#v}"
          git push
