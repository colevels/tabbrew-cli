version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        update-types: [minor, patch]
